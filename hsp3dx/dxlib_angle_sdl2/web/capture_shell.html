<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>hsp3dx dxlib_angle_sdl2 capture shell</title>
<style>body{font-family:sans-serif;margin:0;padding:8px;background:#222;color:#eee}
#output{width:100%;height:160px;background:#000;color:#0f0;border:0;font-family:monospace}
#status{color:#ff0}
canvas{border:1px solid #444;background:#000;outline:0}
canvas:focus{border-color:#4af}</style>
</head>
<body>
<h3>hsp3dx dxlib_angle_sdl2 — auto capture shell</h3>
<div id="status">starting…</div>
<canvas id="canvas" width="640" height="480" tabindex="-1"></canvas>
<textarea id="output" readonly></textarea>
<script>
// ?capture=N で N 枚スナップショット送信、?interval=MS で間隔指定
const q = new URLSearchParams(location.search);
const CAPTURE_N = parseInt(q.get('capture') || '3', 10);
const INTERVAL  = parseInt(q.get('interval') || '1000', 10);
const AUTO_CLOSE = q.has('close');

const statusEl = document.getElementById('status');
const outputEl = document.getElementById('output');
const canvasEl = document.getElementById('canvas');

// WebGL デフォは preserveDrawingBuffer=false で、次フレームで canvas が
// クリアされるため toDataURL() が黒になる。emscripten/SDL2 が context を
// 生成する前に getContext を wrap して preserveDrawingBuffer:true を強制。
(function() {
    const orig = canvasEl.getContext.bind(canvasEl);
    canvasEl.getContext = function(type, attrs) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
            attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
        }
        return orig(type, attrs);
    };
})();

function post(path, body) {
    return fetch(path, {method:'POST', body: body, headers:{'Content-Type':'text/plain'}})
        .catch(e => console.error('post err', path, e));
}

let shotsTaken = 0;
function takeShot() {
    try {
        const url = canvasEl.toDataURL('image/png');
        post('/screenshot', url).then(() => {
            shotsTaken++;
            statusEl.textContent = `captured ${shotsTaken}/${CAPTURE_N}`;
            if (shotsTaken >= CAPTURE_N) {
                post('/done', 'ok').then(() => {
                    statusEl.textContent = 'DONE';
                    if (AUTO_CLOSE) setTimeout(() => window.close(), 500);
                });
            } else {
                setTimeout(takeShot, INTERVAL);
            }
        });
    } catch (e) {
        statusEl.textContent = 'canvas read err: ' + e;
    }
}

// hsp3dx 用 keyboard state バッファ (window global、wasm 側 EM_JS から読む)
window.hsp3dxKeyTable = new Uint8Array(512);
var hsp3dxKeyTable = window.hsp3dxKeyTable;

// emscripten SDL2 は document level で keydown を捕まえ、preventDefault する
// (これで F12 / Ctrl+R 等 browser ショートカットが効かなくなる)。
// 我々は capture phase で先回りして、開発系ショートカットだけは
// stopImmediatePropagation で SDL2 に届かせず browser default を発火させる。
// それ以外のキーは何もしない (SDL2 + 下記の hsp3dx 側 handler 両方に届く)。
function _hsp3dxKeyDown(e) {
    var passThrough =
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
        (e.ctrlKey && (e.key === 'r' || e.key === 'R')) ||
        e.key === 'F5';
    if (passThrough) {
        e.stopImmediatePropagation();
        return;
    }
    if (e.keyCode >= 0 && e.keyCode < 512) {
        hsp3dxKeyTable[e.keyCode] = 1;
    }
    console.log('[hsp3dx keydown]', e.keyCode, e.key, 'table[' + e.keyCode + ']=' + hsp3dxKeyTable[e.keyCode]);
}
function _hsp3dxKeyUp(e) {
    if (e.keyCode >= 0 && e.keyCode < 512) {
        hsp3dxKeyTable[e.keyCode] = 0;
    }
}
window.addEventListener('keydown', _hsp3dxKeyDown, true);
window.addEventListener('keyup',   _hsp3dxKeyUp,   true);
document.addEventListener('keydown', _hsp3dxKeyDown, true);
document.addEventListener('keyup',   _hsp3dxKeyUp,   true);

// hsp3dxKeyTable は global として hsp3dx_em_get_keystate からアクセス可能

var Module = {
    canvas: canvasEl,
    print(...args) {
        const text = args.join(' ');
        outputEl.value += text + '\n';
        outputEl.scrollTop = outputEl.scrollHeight;
        post('/log', text + '\n');
    },
    printErr(...args) {
        const text = '[err] ' + args.join(' ');
        outputEl.value += text + '\n';
        outputEl.scrollTop = outputEl.scrollHeight;
        post('/log', text + '\n');
    },
    onRuntimeInitialized() {
        statusEl.textContent = 'runtime ready, waiting ' + INTERVAL + 'ms before first shot';
        // canvas にフォーカスを当てて keyboard event が飛ぶようにする
        canvasEl.focus();
        setTimeout(takeShot, INTERVAL);
    }
};
</script>
{{{ SCRIPT }}}
</body></html>
