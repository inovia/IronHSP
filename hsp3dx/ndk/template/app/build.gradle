apply plugin: 'com.android.application'

android {
    namespace "com.ironhsp.hsp3dx"
    compileSdkVersion 34
    ndkVersion "23.1.7779620"

    defaultConfig {
        applicationId "com.ironhsp.hsp3dx"
        minSdkVersion 27
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // x86_64 のエミュレータで動かす用 + arm64-v8a (実機)
                abiFilters 'x86_64', 'arm64-v8a'
                // DxLib を source build する場合は次行を有効化。
                // prebuilt libDxLib.a / libDxUseCLib.a / libpng.a / libjpeg.a /
                // libzlib.a を使わず、dxlib_angle_sdl2/dxlib_portable + extlib から
                // build する。Movie MediaCodec 差替えや本家 DxLib 改変はこちら。
                arguments "-DDXLIB_FROM_SOURCE=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    //  Phase 4.k: WebSocket via OkHttp (純 Java 3.x 系で Kotlin runtime 不要)
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
}

repositories {
    google()
    mavenCentral()
}
