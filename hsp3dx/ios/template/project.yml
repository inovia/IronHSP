#
#  hsp3dx iOS Xcode プロジェクト (xcodegen 用) — source build 版
#
#  Android 側の DXLIB_FROM_SOURCE と同様、DxLib iOS / DxUseCLib_iOS /
#  libpng_iOS / libjpeg_iOS / libzlib_iOS / libbullet_iOS の prebuilt .a を
#  使わず dxlib_angle_sdl2/dxlib_portable + extlib から source build する構成。
#  Cubism Core (closed-source) と libtiff/ogg/vorbis/opus/theora (bundle 未整備)
#  のみ prebuilt 継続。
#
#  旧 prebuilt 版は project_prebuilt.yml.bak に退避済。
#
#  使い方 (Mac 側):
#      cd hsp3dx/ios/template
#      /opt/homebrew/bin/xcodegen generate
#      xcodebuild -scheme hsp3dx -destination 'generic/platform=iOS Simulator' -sdk iphonesimulator build
#
name: hsp3dx

options:
  bundleIdPrefix: com.ironhsp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "14.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    ENABLE_BITCODE: NO
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_PREPROCESSOR_DEFINITIONS:
      - "HSPIOS=1"
      - "HSP3DX=1"
      - "HSPDEBUG=1"
      - "_HSP64=1"
      - "HSP64=1"
      - "HSPUTF8=1"
      # 起動時間計測ログを有効化する場合は以下を uncomment:
      # - "HSP3DX_IOS_STARTUP_TIMING=1"
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    GCC_WARN_UNUSED_PARAMETER: NO
    GCC_WARN_UNUSED_VARIABLE: NO
    GCC_WARN_64_TO_32_BIT_CONVERSION: NO
    # DxLib 本家ソースは SJIS のため warning を抑制。ASCII 互換のコード部は通る。
    OTHER_CFLAGS:
      - "$(inherited)"
      - "-Wno-invalid-source-encoding"
      - "-Wno-everything"
    OTHER_CPLUSPLUSFLAGS:
      - "$(inherited)"
      - "-Wno-invalid-source-encoding"
      - "-Wno-everything"
    HEADER_SEARCH_PATHS:
      # prebuilt SDK は header 参照用に残す (DxLib 公開 header 互換確認用)
      - "$(SRCROOT)/../../extlib/dxlib_ios/DxLib_iOS/LinkFiles/$(CONFIGURATION)-$(PLATFORM_NAME)"
      - "$(SRCROOT)/../../../hsp3"
      - "$(SRCROOT)/../../src"
      - "$(SRCROOT)/../../extlib/picojson"
      # DxLib source build 用 internal header
      - "$(SRCROOT)/../../dxlib_angle_sdl2/dxlib_portable"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/dxlib_portable/iOS"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/dxlib_portable/Desktop" # DxBulletCompat.h
      # bundle dep source
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/libpng"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/libjpeg"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/zlib"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/bullet3/src"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/libogg/include"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/libvorbis/include"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/libvorbis/lib"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/libtheora/include"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/libopus/include"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/opusfile/include"
      - "$(SRCROOT)/../../dxlib_angle_sdl2/extlib/libtiff/libtiff"
      # Cubism SDK 4 (Cubism 5 fork bundle は API 差があるため使わず)
      - "$(SRCROOT)/../../extlib/cubism_sdk_native/Core/include"
    LIBRARY_SEARCH_PATHS:
      - "$(SRCROOT)/../../extlib/dxlib_ios/DxLib_iOS/LinkFiles/$(CONFIGURATION)-$(PLATFORM_NAME)"
      - "$(SRCROOT)/../../extlib/cubism_sdk_native/Core/lib/ios/$(CONFIGURATION)-$(PLATFORM_NAME)"
    OTHER_LDFLAGS:
      # prebuilt DxLib* / png / jpeg / zlib / bullet は source build に置換 (link 不要)
      # tiff/ogg/vorbis/opus/theora は fork 側の iOS build 未整備のため当面 prebuilt 継続
      - "-ltiff_iOS"
      - "-logg_iOS"
      - "-lopus_iOS"
      - "-lvorbis_iOS"
      - "-ltheora_iOS"
      # Cubism Core (closed-source)
      - "-lLive2DCubismCore"
    ONLY_ACTIVE_ARCH: YES
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "arm64"
    COMPRESS_PNG_FILES: NO
    STRIP_PNG_TEXT: NO
    ASSETCATALOG_COMPRESS_PNG_FILES: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "744LT275TZ"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

schemes:
  hsp3dx:
    build:
      targets:
        hsp3dx: all
        hsp3dx_watch: all
    run:
      config: Debug
    archive:
      config: Release
  hsp3dx_watch:
    build:
      targets:
        hsp3dx_watch: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  hsp3dx:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        name: Sources
      - path: Resources
        name: Resources
      - path: Data
        buildPhase: resources
        optional: true
        excludes:
          - "Hiyori"
          - "YUKARI"
      - path: Data/Hiyori
        type: folder
        buildPhase: resources
        optional: true
      - path: Data/YUKARI
        type: folder
        buildPhase: resources
        optional: true
      # hsp3dx 本体
      - path: ../../src
        name: hsp3dx
        includes:
          - "hgio_dx.cpp"
          - "hsp3dxcl.cpp"
          - "hsp3dx_extcmd.cpp"
          - "hsp3dx_console.cpp"
          - "hsp3dx_dxlib_auto.cpp"
          - "hsp3dx_dxlib_auto_f.cpp"
          - "hsp3dx_ios_dxlib_override.cpp"
          - "hsp3dx_platform_ios.mm"
          - "hsp3dx_platform_common.cpp"
          - "hsp3dx_events.cpp"
          - "hsp3dx_json.cpp"
          - "main_ios.mm"
          - "hsp3dx_http_ios.mm"
          - "hsp3dx_ws_ios.mm"
          - "hsp3dx_platform_io_ios.mm"
      # HSP3 コア
      - path: ../../../hsp3
        name: hsp3
        includes:
          - "hsp3.cpp"
          - "hsp3code.cpp"
          - "hsp3crypt.cpp"
          - "hsp3debug.cpp"
          - "hsp3int.cpp"
          - "hsp3utfcnv.cpp"
          - "hspvar_core.cpp"
          - "hspvar_double.cpp"
          - "hspvar_int.cpp"
          - "hspvar_int64.cpp"
          - "hspvar_label.cpp"
          - "hspvar_str.cpp"
          - "hspvar_struct.cpp"
          - "hspvar_wstr.cpp"
          - "stack.cpp"
          - "strbuf.cpp"
          - "strnote.cpp"
          - "dpmread.cpp"
          - "filepack.cpp"
          - "ios/supio_ios.cpp"
      - path: ../../../hsp3net/hspvar_nstruct.cpp
        name: hsp3net
      # === DxLib portable 共通 source (pristine 3.24f) ===
      #  DxUseCLibPhysics.cpp / DxUseCLib.cpp は DxBulletCompat.h を force-include する
      #  ので glob 除外し、下で個別エントリとして追加
      - path: ../../dxlib_angle_sdl2/dxlib_portable
        name: DxLibPortable
        type: group
        includes:
          - "*.cpp"
        excludes:
          - "DxUseCLibPhysics.cpp"
          - "DxUseCLib.cpp"
      - path: ../../dxlib_angle_sdl2/dxlib_portable/DxUseCLibPhysics.cpp
        compilerFlags: "-include DxBulletCompat.h -UDX_NON_BULLET_PHYSICS"
      - path: ../../dxlib_angle_sdl2/dxlib_portable/DxUseCLib.cpp
        compilerFlags: "-include DxBulletCompat.h -UDX_NON_BULLET_PHYSICS"
      # === DxLib iOS platform (pristine 3.24f) + AVPlayer Movie ===
      - path: ../../dxlib_angle_sdl2/dxlib_portable/iOS
        name: DxLibPortableIOS
        type: group
        includes:
          - "*.cpp"
          - "*.mm"
        excludes:
          # Movie stub は _AVP.mm に置換えるため除外
          - "DxMovieiOS.cpp"
          # _AVP.mm は個別エントリで -fno-objc-arc を付けたいため除外
          - "DxMovieiOS_AVP.mm"
      - path: ../../dxlib_angle_sdl2/dxlib_portable/iOS/DxMovieiOS_AVP.mm
        compilerFlags: "-fno-objc-arc"
      # === libpng 1.6.45 source ===
      - path: ../../dxlib_angle_sdl2/extlib/libpng
        name: libpng
        type: group
        includes:
          - "*.c"
          - "arm/arm_init.c"
          - "arm/filter_neon_intrinsics.c"
          - "arm/palette_neon_intrinsics.c"
      # === libjpeg-turbo 3.0.4 source (SIMD 無効、pure C、8-bit 専用) ===
      - path: ../../dxlib_angle_sdl2/extlib/libjpeg
        name: libjpeg
        type: group
        includes:
          - "*.c"
        excludes:
          # 他 .c から #include される template ファイル群 (standalone compile 不可)
          - "jstdhuff.c"
          - "jccolext.c"
          - "jdcolext.c"
          - "jdcol565.c"
          - "jdmrgext.c"
          - "jdmrg565.c"
      # === zlib 1.3.1 source ===
      - path: ../../dxlib_angle_sdl2/extlib/zlib
        name: zlib
        type: group
        includes:
          - "adler32.c"
          - "compress.c"
          - "crc32.c"
          - "deflate.c"
          - "infback.c"
          - "inffast.c"
          - "inflate.c"
          - "inftrees.c"
          - "trees.c"
          - "uncompr.c"
          - "zutil.c"
      # === Bullet Physics (LinearMath / BulletCollision / BulletDynamics / BulletSoftBody) ===
      - path: ../../dxlib_angle_sdl2/extlib/bullet3/src/LinearMath
        name: bullet_LinearMath
        type: group
        includes:
          - "**/*.cpp"
      - path: ../../dxlib_angle_sdl2/extlib/bullet3/src/BulletCollision
        name: bullet_Collision
        type: group
        includes:
          - "**/*.cpp"
      - path: ../../dxlib_angle_sdl2/extlib/bullet3/src/BulletDynamics
        name: bullet_Dynamics
        type: group
        includes:
          - "**/*.cpp"
      - path: ../../dxlib_angle_sdl2/extlib/bullet3/src/BulletSoftBody
        name: bullet_SoftBody
        type: group
        includes:
          - "**/*.cpp"
      # === DxUseCLibPhysics.cpp / DxUseCLib.cpp に force-include DxBulletCompat.h ===
      #  (DxLib の D_bt* → bt* shim。上記 DxLibPortable に既に含まれるので per-file
      #   compilerFlags は後述 targetTemplates / settings で指定)
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "com.ironhsp.hsp3dx"
        PRODUCT_NAME: "hsp3dx"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreLocation.framework
      - sdk: GameController.framework
      - sdk: MessageUI.framework
      - sdk: Metal.framework
      - sdk: GLKit.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CFNetwork.framework
      - sdk: CoreText.framework
      - sdk: ImageIO.framework
      - sdk: OpenAL.framework
      - sdk: LocalAuthentication.framework
      - sdk: WatchConnectivity.framework

  # ===========================================================================
  # hsp3dx_watch — watchOS app (HSP for Apple Watch、 mini interpreter)
  # ===========================================================================
  # Phase 1 (skeleton): SwiftUI で時計表示。 .ax interpreter は Phase 2 以降。
  # standalone watchOS app (paired iPhone なしでも動作)。
  # 使い方:
  #   /opt/homebrew/bin/xcodegen generate
  #   xcodebuild -scheme hsp3dx_watch -destination 'generic/platform=watchOS Simulator' build
  hsp3dx_watch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: Watch/Sources
        name: Sources
      - path: Watch/Resources
        name: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: Watch/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "com.ironhsp.hsp3dx.watch"
        PRODUCT_NAME: "hsp3dx"
        TARGETED_DEVICE_FAMILY: "4"   # 4 = Apple Watch
        SWIFT_VERSION: "5.0"
        # iOS app の base settings を継承するが、 watchOS には不要 / 無効な
        # 設定を override する。
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        IPHONEOS_DEPLOYMENT_TARGET: ""
        EXCLUDED_ARCHS: ""
        # iOS prebuilt lib (tiff_iOS / Cubism Core 等) は Watch では link 不要
        # base settings を完全 override (空文字列で inherit 無効化)
        OTHER_LDFLAGS: ""
        LIBRARY_SEARCH_PATHS: ""
        HEADER_SEARCH_PATHS: ""
        OTHER_CFLAGS: ""
        OTHER_CPLUSPLUSFLAGS: ""
        GCC_PREPROCESSOR_DEFINITIONS: ""
        # Code signing (iOS app と同じ team)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "744LT275TZ"
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WatchKit.framework
      - sdk: Foundation.framework
      - sdk: WatchConnectivity.framework
